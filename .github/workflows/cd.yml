# ===========================================================================
# CD — on every merge to main: OIDC to AWS, build and push the SHA-tagged image,
# deploy to App Runner, then a smoke test that the deployed version is this commit.
# Off until the repository variable ENABLE_CLOUD_DEPLOYMENT is "true" (AWS set up).
# Weekly retraining lives in retrain.yml; it never deploys.
# ===========================================================================
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC authentication to AWS
  contents: read

env:
  AWS_REGION: ca-central-1
  ECR_REPOSITORY: boreal-marche
  APP_RUNNER_SERVICE: boreal-marche-api

jobs:
  # -----------------------------------------------------------------------
  # 1. Build, tag, and push Docker image
  # -----------------------------------------------------------------------
  build-and-push:
    if: vars.ENABLE_CLOUD_DEPLOYMENT == 'true'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      # Authenticate to AWS via OIDC — no long-lived credentials stored
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        run: |
          IMAGE_URI="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          SHA_TAG="${IMAGE_URI}:${{ github.sha }}"
          LATEST_TAG="${IMAGE_URI}:latest"
          echo "tags=${SHA_TAG},${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  # -----------------------------------------------------------------------
  # 2. Deploy to App Runner
  # -----------------------------------------------------------------------
  deploy:
    needs: build-and-push
    if: vars.ENABLE_CLOUD_DEPLOYMENT == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy to App Runner
        run: |
          IMAGE_URI="${{ needs.build-and-push.outputs.image_tag }}"
          # Extract the SHA-tagged URI (first of the comma-separated tags)
          SHA_IMAGE=$(echo "$IMAGE_URI" | cut -d',' -f1)

          aws apprunner update-service \
            --service-arn "${{ secrets.APP_RUNNER_SERVICE_ARN }}" \
            --source-configuration "{
              \"ImageRepository\": {
                \"ImageIdentifier\": \"${SHA_IMAGE}\",
                \"ImageRepositoryType\": \"ECR\",
                \"ImageConfiguration\": {
                  \"Port\": \"8000\"
                }
              }
            }"

          echo "Deployed image: ${SHA_IMAGE}"

  # -----------------------------------------------------------------------
  # 3. Post-deploy smoke test
  # -----------------------------------------------------------------------
  smoke-test:
    needs: deploy
    if: vars.ENABLE_CLOUD_DEPLOYMENT == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployment to stabilise
        run: sleep 60

      - name: Smoke test — health
        run: |
          HEALTH=$(curl -sf "${{ secrets.APP_URL }}/health")
          echo "Health: $HEALTH"
          echo "$HEALTH" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assert data['status'] == 'ok', f'Health check failed: {data}'
          print('✅ Health check passed')
          "

      - name: Smoke test — version matches commit SHA
        run: |
          VERSION=$(curl -sf "${{ secrets.APP_URL }}/version")
          echo "Version: $VERSION"
          echo "$VERSION" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          expected_sha = '${{ github.sha }}'
          actual_sha = data.get('git_sha', '')
          assert actual_sha == expected_sha, (
              f'SHA mismatch: deployed={actual_sha}, expected={expected_sha}'
          )
          print('✅ Version SHA matches deployed commit')
          "
