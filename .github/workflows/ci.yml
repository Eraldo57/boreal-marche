# ===========================================================================
# CI — runs on every pull request and push to main
# ===========================================================================
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # 1. Lint
  # -----------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check src/ api/ frontend/ tests/ scripts/

      - name: Check formatting
        run: ruff format --check src/ api/ frontend/ tests/ scripts/

  # -----------------------------------------------------------------------
  # 2. Type checking
  # -----------------------------------------------------------------------
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Run mypy
        run: mypy src/ api/ --ignore-missing-imports

  # -----------------------------------------------------------------------
  # 3. Tests with coverage gate
  # -----------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Run tests with coverage
        run: |
          coverage run --source=src,api -m pytest tests/ -v --tb=short
          coverage report --fail-under=80
          coverage xml -o coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # -----------------------------------------------------------------------
  # 3b. Assistant golden set: tool choice and out-of-scope refusal (brief 3.4)
  # -----------------------------------------------------------------------
  assistant-tool-choice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Golden-set tool choice (rule provider; no API, index or LLM needed)
        run: python -m pytest tests/test_assistant_eval.py -v

  # -----------------------------------------------------------------------
  # 4. Data-quality assertions (only if processed data exists)
  # -----------------------------------------------------------------------
  data-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Run data-quality checks
        run: |
          if [ -f data/processed/transactions.parquet ]; then
            python -m pytest tests/ -k "data_quality" -v
          else
            echo "No processed data found — skipping data-quality checks."
          fi

  # -----------------------------------------------------------------------
  # 5. Docker build of both images (verify they build and report size; don't push)
  # -----------------------------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: boreal-marche/${{ matrix.target }}:ci-${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Report image size (linux/amd64, uncompressed)
        run: |
          IMAGE=boreal-marche/${{ matrix.target }}:ci-${{ github.sha }}
          BYTES=$(docker history --human=false --format '{{.Size}}' "$IMAGE" | awk '{s+=$1} END {print s}')
          echo "${{ matrix.target }} image: $((BYTES / 1000000)) MB uncompressed (sum of layers)" | tee -a "$GITHUB_STEP_SUMMARY"

  # -----------------------------------------------------------------------
  # 6. Secret scan
  # -----------------------------------------------------------------------
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for scanning

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
