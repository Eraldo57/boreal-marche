[project]
name = "boreal-marche"
version = "0.1.0"
description = "Boréal Marché — Customer Intelligence Platform"
requires-python = ">=3.12,<3.14"
# Serving runtime: what the API process imports. The API image installs only this list.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "scikit-learn>=1.6,<1.8",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyarrow>=17",
    "scipy>=1.13",
    "sqlalchemy>=2,<2.1",  # prediction-log table; MLflow 2.x imports pool APIs removed in 2.1
    "psycopg[binary]>=3.2,<4",  # PostgreSQL driver for the Compose database
    "joblib>=1.4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "openai>=1.35",
    "sentence-transformers>=3.4,<6",
    "transformers>=4.45,<5",
    "chromadb>=1.0,<2",
    "pyyaml>=6.0",
    "structlog>=24.1",
    # Registry client only (~45 MB): resolves the champion alias at startup. The full mlflow
    # package (server, UI, training integrations) stays in the train extra.
    "mlflow-skinny>=2.20,<3",
    "google-auth>=2,<3",  # short-lived identity tokens for private Cloud Run MLflow
]

[project.optional-dependencies]
# Offline pipeline only: ingestion of the .xlsx, training, tuning, tracking, rule mining.
train = [
    "mlflow>=2.20,<3",
    "matplotlib>=3.8,<4",  # report figures (src/plots.py); never imported by the API
    "optuna>=4,<5",
    "mlxtend>=0.23.4,<0.24",
    "openpyxl>=3.1",
]
# Streamlit interface. The frontend image installs frontend/requirements.txt, which must match.
frontend = [
    "streamlit>=1.37",
]
dev = [
    "boreal-marche[train,frontend]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # Exact versions: both gate CI, and a newer release can add rules or errors on unchanged code.
    "ruff==0.16.9",  # keep in step with the lint job in .github/workflows/ci.yml
    "mypy==2.3.1",
    "coverage>=7.5",
    "dvc>=3,<4",
    "ipython>=8,<10",  # executable notebook display helpers
]
# scripts/sagemaker_jobs.py talks to SageMaker, S3 and ECR through boto3 directly; the
# training and endpoint image is docker/Dockerfile, target "sagemaker".
sagemaker = [
    "boto3>=1.34",
]
gcp = [
    "google-cloud-storage>=2.18,<4",
    "cloudml-hypertune==0.1.0.dev6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Conventional sklearn design-matrix notation, not a correctness exemption.
"src/features.py" = ["N803", "N806"]
"src/train.py" = ["N803", "N806"]
"src/fairness.py" = ["N803", "N806"]
"src/minimisation.py" = ["N803", "N806"]
"src/registry.py" = ["N803", "N806"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires generated local artifacts"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "api*", "frontend*", "scripts*"]
