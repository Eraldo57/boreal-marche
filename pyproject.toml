[project]
name = "boreal-marche"
version = "0.1.0"
description = "Boréal Marché — Customer Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "mlflow>=2.15",
    "optuna>=3.6",
    "mlxtend>=0.23",
    "joblib>=1.4",
    "streamlit>=1.37",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "openai>=1.35",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "pyyaml>=6.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "coverage>=7.5",
]
sagemaker = [
    "sagemaker>=2.220",
    "boto3>=1.34",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
